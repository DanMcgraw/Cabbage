[package]
name = "cabbage-core"
version = "0.1.0"
edition = "2024"
authors = ["Pumpkin Server Admin"]
description = "Cabbage core server utility plugin: commands, drop cleanup, metrics, and event logging."
license = "GPL-3.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
cabbage-api = { path = "../api" }
ctor = "0.2"
pumpkin = { path = "../../Pumpkin/pumpkin" }
pumpkin-nbt = { path = "../../Pumpkin/pumpkin-nbt" }
pumpkin-util = { path = "../../Pumpkin/pumpkin-util" }
pumpkin-world = { path = "../../Pumpkin/pumpkin-world" }
ron = "0.8"
ruzstd = "0.8.3"
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.30"
uuid = "1.23"
