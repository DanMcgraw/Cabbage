[package]
name = "cabbage-core"
version = "0.1.0"
edition = "2024"
authors = ["Pumpkin Server Admin"]
description = "Cabbage core server utility plugin: commands, drop cleanup, metrics, and event logging."
license = "GPL-3.0"

[lib]
name = "Cabbage"
crate-type = ["cdylib"]

[dependencies]
cabbage-api = { path = "../api" }
cabbage-mmo = { path = "../mmo" }
cabbage-mobai = { path = "../mobai" }
ctor = "1.0.10"
pumpkin = { path = "../../Pumpkin/pumpkin", default-features = false }
pumpkin-nbt = { path = "../../Pumpkin/pumpkin-nbt" }
pumpkin-util = { path = "../../Pumpkin/pumpkin-util" }
pumpkin-world = { path = "../../Pumpkin/pumpkin-world" }
ron = "0.12.2"
ruzstd = { version = "0.8.3", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
uuid = { version = "1.24.0", default-features = false, features = ["std", "v4"] }
